# ─────────────────────────────────────────────────────────────────────────
#  Nginx reverse proxy for RoboGrid AI
#  - serves collected static/media directly
#  - proxies REST to the ASGI app
#  - upgrades /ws/ connections to WebSocket
#  For TLS, mount certs and uncomment the 443 server block.
# ─────────────────────────────────────────────────────────────────────────
upstream robogrid_app {
    server web:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # ── Static & media ───────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # ── WebSockets (Django Channels) ─────────────────────────────────────
    location /ws/ {
        proxy_pass http://robogrid_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived telemetry sockets
    }

    # ── HTTP API + admin ─────────────────────────────────────────────────
    location / {
        proxy_pass http://robogrid_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

