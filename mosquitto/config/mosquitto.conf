# ─────────────────────────────────────────────────────────────────────────
#  Mosquitto broker config (development defaults)
#
#  ⚠ Production: disable anonymous access, enable a password_file + ACL so each
#  device can only publish/subscribe under its own  robogrid/devices/<serial>/*
#  subtree, and terminate TLS on 8883. See the deployment guide.
# ─────────────────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# MQTT over TCP
listener 1883
protocol mqtt

# MQTT over WebSockets (handy for browser-based device emulators / dashboards)
listener 9001
protocol websockets

# Development only — lock this down in production.
allow_anonymous true

# Production hardening (uncomment and provision):
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/aclfile
